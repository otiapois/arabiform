name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: python -m pip install PyMuPDF==1.26.7
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:fuzz
      - run: npm run verify:pixels
      - run: npm run build
      - run: npm run verify:release
